# ---------------------------------------------------------------
# BOOKLY configuration. No passwords are written in this file:
# values come from environment variables or from a local .env file
# (copy .env.example to .env and fill it in - .env is git-ignored).
# ---------------------------------------------------------------
spring.config.import=optional:file:.env[.properties]

spring.application.name=bookly

# ---------- MySQL (database: bookly_db) ----------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/bookly_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:112327}

# "update" adds new tables/columns and never drops existing data (development setting).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata

# ---------- Thymeleaf ----------
spring.thymeleaf.cache=false

# ---------- Errors: never show stack traces or internal messages to users ----------
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false
server.error.whitelabel.enabled=false

# ---------- Session ----------
server.servlet.session.timeout=60m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.tracking-modes=cookie

# ---------- Administrator account (created/updated at start-up) ----------
bookly.admin.email=${BOOKLY_ADMIN_EMAIL:admin@gmail.com}
bookly.admin.password=${BOOKLY_ADMIN_PASSWORD:admin112327}
bookly.admin.name=${BOOKLY_ADMIN_NAME:Bookly Admin}

# ---------- Sample catalogue (18 books, inserted once, never duplicated) ----------
bookly.seed.enabled=${BOOKLY_SEED:true}
