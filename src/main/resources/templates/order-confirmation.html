<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Order Confirmed')}"></head>
<body>
<header th:replace="~{fragments/navbar :: navbar}"></header>

<main id="main" class="page narrow">
    <section class="card confirmation">
        <div class="confirm-icon" aria-hidden="true">✓</div>
        <p class="eyebrow">THANK YOU</p>
        <h1 class="page-title">Your order is placed!</h1>
        <p class="page-subtitle">
            Order <strong th:text="'#' + ${order.id}">#1</strong> was received on
            <span th:text="${#temporals.format(order.orderDate, 'dd MMM yyyy, hh:mm a')}">date</span>.
        </p>

        <dl class="detail-facts">
            <div><dt>Status</dt><dd><span class="status-pill" th:classappend="'status-' + ${order.status.key}" th:text="${order.status.label}">Pending</span></dd></div>
            <div><dt>Payment</dt><dd th:text="${order.paymentMethod.label + ' · ' + order.paymentStatus.label}">Cash on Delivery</dd></div>
            <div><dt>Deliver to</dt><dd><span th:text="${order.customerName}">Name</span>, <span th:text="${order.phone}">Phone</span><br><span th:text="${order.address}">Address</span></dd></div>
        </dl>

        <div th:replace="~{order-detail :: itemsTable(${order})}"></div>

        <div class="form-actions center">
            <a class="button button-primary" th:href="@{/orders/{id}(id=${order.id})}">Track this order</a>
            <a class="button button-outline" th:href="@{/#books}">Continue shopping</a>
        </div>
    </section>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
