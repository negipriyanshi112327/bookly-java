<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Create Account')}"></head>
<body>
<header th:replace="~{fragments/navbar :: navbar}"></header>

<main id="main" class="auth-page">
    <section class="auth-card">
        <p class="eyebrow">JOIN THE BOOKLY COMMUNITY</p>
        <h1>Create account</h1>
        <p class="intro">Save books to your wishlist, order with Cash on Delivery and review what you read.</p>

        <form th:action="@{/register}" th:object="${form}" method="post" class="stack-form" novalidate data-validate>
            <div class="alert alert-error" role="alert" th:if="${#fields.hasGlobalErrors()}">
                <p th:each="e : ${#fields.globalErrors()}" th:text="${e}">Error</p>
            </div>
            <div class="field" th:classappend="${#fields.hasErrors('name')} ? 'has-error'">
                <label for="name">Full name</label>
                <input id="name" type="text" th:field="*{name}" required minlength="2" maxlength="100"
                       autocomplete="name" placeholder="Your full name">
                <p class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">Error</p>
            </div>
            <div class="field" th:classappend="${#fields.hasErrors('email')} ? 'has-error'">
                <label for="email">Email address</label>
                <input id="email" type="email" th:field="*{email}" required maxlength="150"
                       autocomplete="email" placeholder="you@example.com">
                <p class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">Error</p>
            </div>
            <div class="field" th:classappend="${#fields.hasErrors('password')} ? 'has-error'">
                <label for="password">Password</label>
                <div class="password-wrap">
                    <input id="password" type="password" name="password" required minlength="8" maxlength="72"
                           autocomplete="new-password" placeholder="At least 8 characters"
                           aria-describedby="passwordHint">
                    <button type="button" class="password-toggle" data-toggle-password="password"
                            aria-label="Show password">Show</button>
                </div>
                <p class="hint" id="passwordHint">8–72 characters with at least one letter and one number.</p>
                <p class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}">Error</p>
            </div>
            <div class="field" th:classappend="${#fields.hasErrors('confirmPassword')} ? 'has-error'">
                <label for="confirmPassword">Confirm password</label>
                <input id="confirmPassword" type="password" name="confirmPassword" required
                       autocomplete="new-password" placeholder="Type it again" data-match="password">
                <p class="field-error" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}">Error</p>
            </div>
            <button class="button button-primary full" type="submit">Create account</button>
        </form>

        <p class="form-bottom">Already have an account? <a th:href="@{/login}">Log in</a></p>
    </section>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
