# Test settings: an in-memory H2 database in MySQL mode, so tests never touch bookly_db.
spring.datasource.url=jdbc:h2:mem:bookly_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.thymeleaf.cache=false

server.error.include-stacktrace=never
server.error.include-message=never

bookly.admin.email=admin@test.local
bookly.admin.password=AdminPass123
bookly.admin.name=Test Admin
bookly.seed.enabled=false
